# The typed-consumer check (CI, blocking): strict typing of code that USES the
# SDK. The SDK's own modules are followed for their types but their internal
# errors are not reported here (that is the advisory "mypy src" step).
[mypy]
python_version = 3.11
strict = True
warn_unused_configs = True

[mypy-kbm_ledsas_sdk.*]
follow_imports = silent
