[build-system]
# Build backend pinned exactly (not a floor): an unpinned setuptools changes the
# wheel (its dist-info/WHEEL "Generator:" line) whenever setuptools releases.
# The wheel is reproducible: built from the tagged commit with these pins,
# SOURCE_DATE_EPOCH set to the commit time and umask 022 (as the CI and release
# workflows do), it is byte-identical to the wheel published to PyPI. The sdist
# is not (its tar and gzip headers carry the build time and the builder's
# account). Keep these pins equal to .github/release-requirements.in. Bump
# deliberately.
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kbm-ledsas-sdk"
version = "0.3.6"
description = "KeborMed LEDSAS SDK - Python client for building Local External Data Sources Action Service (LEDSAS) data-processing services"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.txt"]
authors = [
    { name = "KeborMed", email = "support@kebormed.com" },
]
keywords = ["ledsas", "kebormed", "rabbitmq", "azure-blob", "medical", "data-processing", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5.0,<3.0",
    "aio-pika>=9.4.0,<11.0",
    # Imported directly (exceptions, and the protocol decoders the SDK
    # makes tolerant of non-UTF-8 message properties), so declared with the
    # ranges the SDK is tested with rather than left to aio-pika.
    "aiormq>=6.8.0,<8.0",
    "pamqp>=3.3.0,<5.0",
    "azure-storage-blob>=12.19.0,<13.0",
    # Imported directly (azure.core). Security floor: 1.38.0 fixes
    # CVE-2026-21226 (PYSEC-2026-1208); without it an in-place upgrade keeps
    # an older, vulnerable azure-core.
    "azure-core>=1.38.0,<2.0",
    # Health server + azure-storage-blob async transport. Security floor:
    # 3.14.3 fixes CVE-2026-69244.
    "aiohttp>=3.14.3,<4.0",
    # Security floor: cryptography arrives transitively via azure-storage-blob
    # (which imposes no upper bound). 50.0.0 fixes CVE-2026-69247
    # (GHSA-g6cj-pr64-35w5); pinning the floor keeps every install off the
    # vulnerable releases and resolves cleanly to the latest patch.
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Upper bounds on the formatters, linters and type checker so a future
    # release can't reformat the tree or add rules and break `black --check` /
    # `ruff check` / the blocking mypy checks on an unrelated PR. Bump
    # deliberately.
    "ruff>=0.5,<0.18",
    "black>=26.3.1,<27",
    "mypy>=1.10,<3",
    "build>=1.2.1",
    "twine>=6.1,<8",
]

[project.urls]
Homepage = "https://github.com/Kubyk-Health/kbm-ledsas-sdk"
Repository = "https://github.com/Kubyk-Health/kbm-ledsas-sdk"
Issues = "https://github.com/Kubyk-Health/kbm-ledsas-sdk/issues"
Changelog = "https://github.com/Kubyk-Health/kbm-ledsas-sdk/blob/v0.3.6/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["kbm_ledsas_sdk*"]

[tool.setuptools.package-data]
kbm_ledsas_sdk = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: live tests that need a RabbitMQ (127.0.0.1:5672, or LEDSAS_TEST_RABBITMQ_URL; skipped when none answers)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pragmatic baseline for launch: correctness (E/F/W), imports (I), modern syntax
# (UP), common bugs (B), comprehensions (C4), and Ruff's own rules. The stricter
# families (typing-annotations, security-asserts, docstrings, etc.) can be
# adopted incrementally. Line length is enforced by black, so E501 is ignored.
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# C408: dict(...) literals are fine in test fixtures; UP031: one test deliberately
# exercises %-formatting to prove credential redaction. B018 (a bare expression
# evaluated for its side effect, such as reading a property that must raise),
# B007 / F841 (loop variables and locals kept for readability) and C416 (a
# comprehension kept for symmetry with its neighbours) are test idioms.
"tests/**" = ["B007", "B011", "B017", "B018", "C408", "C416", "F841", "UP031"]

[tool.coverage.run]
source = ["kbm_ledsas_sdk"]
omit = ["*/tests/*", "*/__pycache__/*"]
