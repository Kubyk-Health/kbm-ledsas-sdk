name: DCO

# Verifies every commit in a pull request carries a "Signed-off-by:" trailer
# for its author (Developer Certificate of Origin): the trailer must name the
# commit's author exactly, as `git commit -s` writes it. See CONTRIBUTING.md.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the author's Signed-off-by on all PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list "$BASE".."$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%(trailers:key=Signed-off-by)' "$sha" | grep -Fqx "Signed-off-by: $author"; then
              echo "::error::commit $sha is missing a Signed-off-by trailer for its author ($author)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more commits are not signed off by their author. See CONTRIBUTING.md (git commit -s)."
            exit 1
          fi
          echo "All commits are signed off by their authors."
