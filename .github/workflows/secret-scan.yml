name: Secret scan

# Defense-in-depth secret scanning of the checked-out tree on every push to
# main and every pull request, alongside GitHub's own secret scanning and push
# protection (enabled in the repository settings). Both tools run from pinned
# container images, so no paid action license is required.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --config /repo/.gitleaks.toml --redact -v

  trufflehog:
    name: trufflehog (verified only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan filesystem (fail only on verified secrets)
        # Pinned official image (mirrors the gitleaks job) instead of piping
        # an install script from an unpinned branch into a shell.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/trufflesecurity/trufflehog:3.95.9 \
            filesystem /repo --only-verified --fail --no-update
