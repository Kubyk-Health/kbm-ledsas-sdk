name: Secret scan

# Defense-in-depth secret scanning on every push to main and every pull
# request, alongside GitHub's own secret scanning and push protection (enabled
# in the repository settings). Both tools run from container images pinned by
# digest, so no paid action license is required. Each scans the checked-out
# tree AND the commits: a pull request's own commits (base..head), and on main
# the whole history, so a secret added and removed again in a branch is found.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  # 3.97.0 or later: earlier releases report 40-character test function names
  # as verified Lob API keys.
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog:3.99.2@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the tree
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" "$GITLEAKS_IMAGE" \
            dir /repo --config /repo/.gitleaks.toml --redact -v
      - name: Scan the commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          range=()
          if [ -n "$BASE" ]; then range=(--log-opts="${BASE}..${HEAD}"); fi
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --redact -v "${range[@]}"

  trufflehog:
    name: trufflehog (verified only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the tree (fail only on verified secrets)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" "$TRUFFLEHOG_IMAGE" \
            filesystem /repo --only-verified --fail --no-update
      - name: Scan the commits (fail only on verified secrets)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          range=()
          if [ -n "$BASE" ]; then range=(--since-commit "$BASE" --branch "$HEAD"); fi
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" "$TRUFFLEHOG_IMAGE" \
            git file:///repo "${range[@]}" --only-verified --fail --no-update
