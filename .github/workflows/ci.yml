name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Type check the SDK source (mypy, advisory)
        run: mypy src
        # Strict typing of the SDK's own source is being adopted incrementally;
        # report but don't block yet. The typed-consumer step below blocks.
        continue-on-error: true
      - name: Type check a consumer of the public API (mypy --strict, blocking)
        env:
          MYPYPATH: src
        run: mypy --config-file tests/typing/mypy.ini tests/typing/typed_consumer.py
      - name: Type check the documented calls (pytest + mypy --strict, blocking)
        env:
          LEDSAS_REQUIRE_MYPY: "1"
        run: python -m pytest -q tests/test_typed_consumer.py
      - name: Tests
        run: pytest -q -m "not integration"
      - name: Example service tests
        working-directory: examples/hello_world_service
        run: pytest -q -W error::pytest.PytestConfigWarning tests/

  integration:
    name: integration (live RabbitMQ)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        # The image of examples/hello_world_service/deploy/local, pinned by digest.
        image: rabbitmq:4.1-management-alpine@sha256:72b92455b387f14d44efa3b9b4553bae3d8d82cd515376712ae08d67fc9a7b0d
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration tests
        run: pytest -q -m integration -rs tests/integration

  build:
    name: build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the pinned build toolchain
        run: python -m pip install --require-hashes -r .github/release-requirements.txt
      - name: Build sdist + wheel (twice; the wheels must be identical)
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python -m build --no-isolation --outdir dist
          rm -rf build src/*.egg-info
          python -m build --no-isolation --outdir dist2
          for w in dist/*.whl; do
            cmp "$w" "dist2/$(basename "$w")" || { echo "::error::a second build of $w differs"; exit 1; }
            sha256sum "$w"
          done
      - name: Check metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
