name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}${{ matrix.aio-pika == '9' && ', aio-pika 9' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        aio-pika: ["default"]
        include:
          # The lowest major the dependency range admits (a fresh install gets 10.x).
          - python-version: "3.11"
            aio-pika: "9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        env:
          AIO_PIKA: ${{ matrix.aio-pika }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "$AIO_PIKA" = 9 ]; then pip install "aio-pika>=9.4.0,<10" "aiormq<7"; fi
          pip list | grep -Ei '^(aio-pika|aiormq) '
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Type check the SDK source (mypy, advisory)
        run: mypy src
        # Strict typing of the SDK's own source is being adopted incrementally;
        # report but don't block yet. The typed-consumer step below blocks.
        continue-on-error: true
      - name: Type check the public modules (mypy --strict, blocking)
        # The modules behind the public API (message models, ExecutionContext,
        # the blob operations, the log formatter, ServiceApp) are strict-clean;
        # the rest of src/ is still reported by the advisory step above.
        env:
          MYPYPATH: src
        run: >-
          mypy --strict --follow-imports=silent
          src/kbm_ledsas_sdk/models src/kbm_ledsas_sdk/runtime/context.py src/kbm_ledsas_sdk/blob/operations.py src/kbm_ledsas_sdk/blob/direct_operations.py src/kbm_ledsas_sdk/utils/logging.py src/kbm_ledsas_sdk/app.py
      - name: Type check a consumer of the public API (mypy --strict, blocking)
        env:
          MYPYPATH: src
        run: mypy --config-file tests/typing/mypy.ini tests/typing/typed_consumer.py
      - name: Type check the documented calls (pytest + mypy --strict, blocking)
        env:
          LEDSAS_REQUIRE_MYPY: "1"
        run: python -m pytest -q tests/test_typed_consumer.py
      - name: Tests
        # -W error: a new warning (an unclosed socket, a deprecated call) fails the run.
        run: pytest -q -m "not integration" -W error
      - name: Example service tests
        working-directory: examples/hello_world_service
        run: pytest -q -W error::pytest.PytestConfigWarning tests/

  integration:
    name: integration (live RabbitMQ)
    runs-on: ubuntu-latest
    env:
      # The Azurite image of examples/hello_world_service/deploy/local, pinned by digest
      # (started in a step: a service container cannot take Azurite's arguments).
      AZURITE_IMAGE: mcr.microsoft.com/azure-storage/azurite:3.34.0@sha256:0a47e12e3693483cef5c71f35468b91d751611f172d2f97414e9c69113b106d9
    services:
      rabbitmq:
        # The image of examples/hello_world_service/deploy/local, pinned by digest.
        image: rabbitmq:4.1-management-alpine@sha256:72b92455b387f14d44efa3b9b4553bae3d8d82cd515376712ae08d67fc9a7b0d
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start Azurite
        run: |
          set -euo pipefail
          docker run -d --name azurite -p 127.0.0.1:10000:10000 "$AZURITE_IMAGE" \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          for _ in $(seq 60); do nc -z 127.0.0.1 10000 && exit 0; sleep 1; done
          docker logs azurite
          exit 1
      - name: Integration tests (none may skip)
        run: |
          set -euo pipefail
          pytest -q -m integration -rs tests/integration | tee integration.out
          if grep -Eq '[0-9]+ skipped' integration.out; then
            echo "::error::an integration test was skipped (see the 'SKIPPED' lines above)"
            exit 1
          fi

  build:
    name: build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the pinned build toolchain
        run: python -m pip install --require-hashes -r .github/release-requirements.txt
      - name: Build sdist + wheel (twice; the wheels must be identical)
        run: |
          set -euo pipefail
          # The release workflow builds the same way: file modes from umask 022,
          # timestamps from the commit time.
          umask 022
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python -m build --no-isolation --outdir dist
          rm -rf build src/*.egg-info
          python -m build --no-isolation --outdir dist2
          for w in dist/*.whl; do
            cmp "$w" "dist2/$(basename "$w")" || { echo "::error::a second build of $w differs"; exit 1; }
            sha256sum "$w"
          done
      - name: Check metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
