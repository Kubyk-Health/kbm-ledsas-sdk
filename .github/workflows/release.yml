name: Release

# Two ways to run:
#   1. Publish a GitHub Release  -> checks the tag, tests, builds (recording the
#      SHA-256 of every file built), publishes to PyPI after checking the files
#      against those digests, checks that PyPI holds exactly the built files,
#      then generates the SBOM and attaches the sdist, the wheel and the SBOM to
#      the Release.
#   2. Run manually (workflow_dispatch) on main -> the same build with a
#      ".devN" version, published to TestPyPI only (a rehearsal of the whole
#      flow; every run gets a new version, so it can be repeated).
#
# What is built is the tagged commit as it is: nothing in the tree is rewritten
# before the build (the links of the package page already name the release
# tag), so a build of the same commit with the same SOURCE_DATE_EPOCH and
# umask gives the same wheel.
#
# Nothing that is not hash-pinned runs before the upload: every tool comes from
# the hash-pinned .github/*-requirements.txt files (pip --require-hashes). The
# SBOM job, which installs the wheel's dependency closure as a user gets it (not
# hash-pinned on purpose), runs after the upload; a failure there leaves the
# published files in place and fails the run before the Release assets are
# attached.
#
# Both use PyPI Trusted Publishing (OIDC) — NO API token is stored in the repo.
# One-time setup (see CONTRIBUTING.md, "Releases"):
#   - PyPI:     a trusted publisher for this repo + workflow, environment "pypi"
#               (with required reviewers).
#   - TestPyPI: a trusted publisher on test.pypi.org, environment "testpypi"
#               (deployment branches: main only).
#   - Tag protection: only maintainers can create v* tags.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    outputs:
      # "sha256sum dist/*" output (base64): the publish jobs check their
      # downloaded files against it before uploading anything.
      digests: ${{ steps.build.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the pinned release toolchain
        run: python -m pip install --require-hashes -r .github/release-requirements.txt
      - name: Check the tag (on main, version matches)
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Only a v<major>.<minor>.<patch> tag (the protected tag pattern) publishes.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the release tag $TAG is not v<major>.<minor>.<patch>"
            exit 1
          fi
          VERSION="${TAG:1}"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the release tag $TAG ($GITHUB_SHA) is not on main"
            exit 1
          fi
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          SRC_VERSION="$(PYTHONPATH=src python -c 'import kbm_ledsas_sdk; print(kbm_ledsas_sdk.__version__)')"
          if [ "$PKG_VERSION" != "$VERSION" ] || [ "$SRC_VERSION" != "$VERSION" ]; then
            echo "::error::pyproject version ($PKG_VERSION) or kbm_ledsas_sdk.__version__ ($SRC_VERSION) does not match the release tag ($TAG)"
            exit 1
          fi
      # The tests run on the tree as committed, before a rehearsal changes the
      # version: they check that the documents name the release version.
      - name: Tests
        run: python -m pytest -q -m "not integration"
      - name: Rehearsal version (TestPyPI)
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::rehearse from main only (this run is on $GITHUB_REF)"
            exit 1
          fi
          BASE="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          DEV="${BASE}.dev$((RUN_NUMBER * 100 + RUN_ATTEMPT))"
          sed -i "s/^version = \"${BASE}\"$/version = \"${DEV}\"/" pyproject.toml
          sed -i "s/^__version__ = \"${BASE}\"$/__version__ = \"${DEV}\"/" src/kbm_ledsas_sdk/__init__.py
          grep -q "^version = \"${DEV}\"$" pyproject.toml
          grep -q "^__version__ = \"${DEV}\"$" src/kbm_ledsas_sdk/__init__.py
          echo "rehearsal version: ${DEV}"
      - name: Check that the package page and the source link a release tag
        run: |
          set -euo pipefail
          # README.md (the PyPI page), pyproject.toml and the source's messages
          # and docstrings link the release tag (v<version>), never main or
          # another tag.
          if grep -rn '/blob/main/\|/tree/main/' README.md pyproject.toml src; then
            echo "::error::README.md, pyproject.toml or src/ links to main instead of a release tag"
            exit 1
          fi
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          VERSION="${VERSION%.dev*}"
          if grep -rnoIE 'kbm-ledsas-sdk/(blob|tree)/[^/]+/' README.md pyproject.toml src | grep -v "/v${VERSION}/$"; then
            echo "::error::README.md, pyproject.toml or src/ links to a tag other than v${VERSION}"
            exit 1
          fi
      - name: Build sdist + wheel
        id: build
        run: |
          set -euo pipefail
          umask 022
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python -m build --no-isolation
          sha256sum dist/*
          echo "digests=$(cd dist && sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Check metadata
        run: |
          set -euo pipefail
          twine check dist/*
          if unzip -p dist/*.whl '*.dist-info/METADATA' | grep -n '/blob/main/\|/tree/main/'; then
            echo "::error::the wheel's METADATA links to main instead of the release tag"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  sbom:
    name: Generate SBOM
    # After the upload (see the header): it installs the published wheel's
    # dependency closure, which is not hash-pinned.
    needs: [build, publish-pypi, publish-testpypi]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      (needs.publish-pypi.result == 'success' || needs.publish-testpypi.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Generate a CycloneDX SBOM from the built wheel
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          WHEEL="${wheels[0]}"
          VERSION="$(basename "$WHEEL" | cut -d- -f2)"
          # The environment the SBOM describes: the wheel's runtime dependency
          # closure as pip resolves it for a user (not hash-pinned on purpose;
          # the install report records the hash of every file installed), without
          # the venv's own seed tooling (pip / setuptools are not SDK dependencies).
          python -m venv /tmp/sdkenv
          /tmp/sdkenv/bin/pip install --quiet --report /tmp/install-report.json "$WHEEL"
          /tmp/sdkenv/bin/pip uninstall --quiet -y pip setuptools wheel || true
          # The SBOM tool, hash-pinned, in a venv of its own.
          python -m venv /tmp/sbomtool
          /tmp/sbomtool/bin/pip install --quiet --require-hashes -r .github/sbom-requirements.txt
          # The root component is the wheel: a rehearsal builds <version>.devN from
          # this tree, so describe the wheel's version (a release: no change).
          sed "s/^version = \"${VERSION%.dev*}\"$/version = \"${VERSION}\"/" pyproject.toml > /tmp/pyproject.toml
          grep -q "^version = \"${VERSION}\"$" /tmp/pyproject.toml
          /tmp/sbomtool/bin/cyclonedx-py environment /tmp/sdkenv/bin/python \
            --pyproject /tmp/pyproject.toml --mc-type library \
            --of JSON --sv 1.6 -o /tmp/raw.cdx.json
          /tmp/sbomtool/bin/python .github/scripts/finish_sbom.py /tmp/raw.cdx.json \
            /tmp/install-report.json "$WHEEL" "$VERSION" "kbm_ledsas_sdk-${VERSION}.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: kbm_ledsas_sdk-*.cdx.json
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kbm-ledsas-sdk/
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Check the files against the build job's digests
        env:
          DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          set -euo pipefail
          echo "$DIGESTS" | base64 -d > "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"
          (cd dist && sha256sum --check --strict "$RUNNER_TEMP/SHA256SUMS")
          if [ "$(find dist -type f | wc -l)" -ne "$(wc -l < "$RUNNER_TEMP/SHA256SUMS")" ]; then
            echo "::error::dist/ holds other files than the build job built"
            exit 1
          fi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # A re-run after a partial upload skips the files PyPI already has
          # (PyPI files are immutable); the next step then fails the run unless
          # PyPI holds exactly the files built in this run.
          skip-existing: true
      - name: Check that PyPI holds exactly these files
        env:
          TAG: ${{ github.event.release.tag_name }}
          DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, sys, time, urllib.request

          version = os.environ["TAG"].removeprefix("v")
          # The build job's digests, not a listing of dist/: the publish action
          # writes its *.publish.attestation files there during the upload.
          local = {}
          for line in base64.b64decode(os.environ["DIGESTS"]).decode().splitlines():
              digest, name = line.split(maxsplit=1)
              local[name.lstrip("*")] = digest
          url = f"https://pypi.org/pypi/kbm-ledsas-sdk/{version}/json"
          remote = {}
          for attempt in range(12):  # the JSON API can lag the upload by a few minutes
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      remote = {u["filename"]: u["digests"]["sha256"] for u in json.load(response)["urls"]}
              except Exception as exc:  # noqa: BLE001 - retried, reported below
                  print(f"attempt {attempt + 1}: {exc}")
              if set(local) <= set(remote):
                  break
              time.sleep(30)
          bad = sorted(n for n in local if remote.get(n) != local[n])
          extra = sorted(set(remote) - set(local))
          for n in bad:
              print(f"::error::{n}: built sha256 {local[n]}, PyPI {remote.get(n, 'missing')}")
          for n in extra:
              print(f"::error::PyPI has {n}, which this run did not build")
          if bad or extra:
              sys.exit(1)
          print(f"PyPI {version} holds exactly the {len(local)} files built in this run")
          PY

  publish-testpypi:
    name: Publish to TestPyPI (rehearsal)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/kbm-ledsas-sdk/
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Check the files against the build job's digests
        env:
          DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          set -euo pipefail
          echo "$DIGESTS" | base64 -d > "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"
          (cd dist && sha256sum --check --strict "$RUNNER_TEMP/SHA256SUMS")
          if [ "$(find dist -type f | wc -l)" -ne "$(wc -l < "$RUNNER_TEMP/SHA256SUMS")" ]; then
            echo "::error::dist/ holds other files than the build job built"
            exit 1
          fi
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  attach-release-assets:
    name: Attach dist + SBOM to GitHub Release
    if: github.event_name == 'release'
    # After publish-pypi, whose last step proves PyPI holds exactly these files:
    # --clobber then only ever replaces an asset with the file PyPI has.
    needs: [publish-pypi, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to upload assets to the Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom
      - name: Upload sdist, wheel and SBOM to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* sbom/*.cdx.json --clobber --repo "$REPO"
