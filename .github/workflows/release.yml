name: Release

# Two ways to run:
#   1. Publish a GitHub Release  -> builds, generates the SBOM, publishes to
#      PyPI, then attaches the sdist, the wheel and the SBOM to the Release.
#   2. Run manually (workflow_dispatch) -> builds, generates the SBOM and
#      publishes to TestPyPI only (a dry-run to rehearse the whole flow before
#      a real release).
#
# The SBOM is generated BEFORE anything is uploaded: a failure there stops the
# run before PyPI or TestPyPI receives a file.
#
# Both use PyPI Trusted Publishing (OIDC) — NO API token is stored in the repo.
# One-time setup:
#   - PyPI:     add a trusted publisher for this repo + workflow, env "pypi".
#   - TestPyPI: add a trusted publisher on test.pypi.org, env "testpypi".

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify version matches tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$PKG_VERSION" != "${TAG#v}" ]; then
            echo "::error::pyproject version ($PKG_VERSION) does not match release tag ($TAG)"
            exit 1
          fi
      - name: Check metadata
        run: |
          python -m pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Generate a CycloneDX SBOM from the built wheel
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          WHEEL="${wheels[0]}"
          VERSION="$(basename "$WHEEL" | cut -d- -f2)"
          # Resolve the wheel's runtime dependency closure in a clean venv and
          # drop the venv's own seed tooling (pip / setuptools / wheel are not
          # SDK dependencies), then describe that environment. The SBOM tool
          # runs from a venv of its own, kept out of the described environment.
          python -m venv /tmp/sdkenv
          /tmp/sdkenv/bin/pip install --quiet "$WHEEL"
          /tmp/sdkenv/bin/pip uninstall --quiet -y pip setuptools wheel || true
          python -m venv /tmp/sbomtool
          /tmp/sbomtool/bin/pip install --quiet "cyclonedx-bom==7.5.0"
          /tmp/sbomtool/bin/cyclonedx-py environment /tmp/sdkenv/bin/python \
            --of JSON --sv 1.6 -o "kbm_ledsas_sdk-${VERSION}.cdx.json"
          ls -l "kbm_ledsas_sdk-${VERSION}.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: kbm_ledsas_sdk-*.cdx.json
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [build, sbom]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kbm-ledsas-sdk/
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # A re-run after a partial upload skips the files PyPI already has
          # instead of failing on them (PyPI files are immutable).
          skip-existing: true

  publish-testpypi:
    name: Publish to TestPyPI (dry-run)
    if: github.event_name == 'workflow_dispatch'
    needs: [build, sbom]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/kbm-ledsas-sdk/
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  attach-release-assets:
    name: Attach dist + SBOM to GitHub Release
    if: github.event_name == 'release'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to upload assets to the Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom
      - name: Upload sdist, wheel and SBOM to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* sbom/*.cdx.json --clobber --repo "$REPO"
