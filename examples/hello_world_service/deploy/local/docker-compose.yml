# Local development infrastructure for the hello-world LEDSAS service:
# RabbitMQ (message queue) + Azurite (Azure Blob Storage emulator).
#
# Usage (from this directory):
#   docker compose up -d --wait # Start services, return once both are healthy
#   docker compose ps           # Check status
#   docker compose down -v      # Stop + discard data
#
# Every host-port mapping below is prefixed with `127.0.0.1:` so the dev
# broker (guest/guest creds) and Azurite (well-known account key) listen on
# loopback only — same threat model the SDK applies to its own health
# server and amqp:// non-loopback refusal.
#
# The host ports default to the standard ones (5672/15672/10000). If another
# local RabbitMQ/Azurite already uses them, choose others, for example
#   HELLO_WORLD_AMQP_PORT=5673 HELLO_WORLD_MGMT_PORT=15673 \
#   HELLO_WORLD_BLOB_PORT=10010 docker compose up -d --wait
# and use the same ports in KBM_LEDSAS_RABBITMQ_URL and the BlobEndpoint of
# KBM_LEDSAS_BLOB_CONN_STRING (.env). The container, volume and network names are
# fixed (one such stack per Docker host): stop the other stack first, or rename
# them, to run a second one.

services:
  rabbitmq:
    # RabbitMQ 4.1 (LTS).
    image: rabbitmq:4.4-management-alpine
    container_name: hello-world-rabbitmq
    ports:
      - "127.0.0.1:${HELLO_WORLD_AMQP_PORT:-5672}:5672"    # AMQP protocol
      - "127.0.0.1:${HELLO_WORLD_MGMT_PORT:-15672}:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hello-world-net

  azurite:
    # Pinned tag — keeps the local-dev image reproducible across machines.
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    container_name: hello-world-azurite
    ports:
      - "127.0.0.1:${HELLO_WORLD_BLOB_PORT:-10000}:10000"  # Blob service (queue/table not mapped)
    # --skipApiVersionCheck lets newer azure-storage-blob SDKs negotiate
    # API versions this Azurite image doesn't recognize yet; -l /data keeps
    # Azurite's data in the azurite_data volume (until `down -v`).
    command: azurite --blobHost 0.0.0.0 -l /data --skipApiVersionCheck
    volumes:
      - azurite_data:/data
    healthcheck:
      # TCP-only probe — Azurite returns HTTP 400 to a no-query probe and
      # may bind IPv4 only, so an HTTP healthcheck false-negatives.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hello-world-net

volumes:
  rabbitmq_data:
    name: hello-world-rabbitmq-data
  azurite_data:
    name: hello-world-azurite-data

networks:
  hello-world-net:
    name: hello-world-net
    driver: bridge
